plugins
{
    id 'java'
}
java
{
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}


group = 'com.restfulBooker'
version = '1.0-SNAPSHOT'

repositories
{
    mavenCentral()
}

dependencies
{
    testImplementation 'io.rest-assured:rest-assured:5.4.0'
    testImplementation 'io.rest-assured:json-schema-validator:5.4.0'

    testImplementation 'org.testng:testng:7.9.0'

    testImplementation 'com.fasterxml.jackson.core:jackson-databind:2.17.0'
    testImplementation 'org.skyscreamer:jsonassert:1.5.1'
    testImplementation 'com.google.code.gson:gson:2.11.0'

    testImplementation 'com.aventstack:extentreports:5.1.1'

    testImplementation 'org.apache.logging.log4j:log4j-core:2.23.1'
    testImplementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.23.1'

    testImplementation 'org.apache.commons:commons-lang3:3.14.0'

    testImplementation 'org.apache.poi:poi:5.2.5'
    testImplementation 'org.apache.poi:poi-ooxml:5.2.5'
}

test {
    useTestNG()
    systemProperty 'env', System.getProperty('env', 'qa')
    testLogging
    {
        events "passed", "skipped", "failed"
        showStandardStreams = true
    }
}